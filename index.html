
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default fallback metadata; page-specific SEO is managed by SEOHead.tsx -->
    <title>Comrade Coders – Software Development & IT Solutions</title>
    <meta
      name="description"
      content="Comrade Coders delivers software development, web development, automation, AI platforms, ERP, CRM, and IT solutions for businesses."
    />

    <!-- Font preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/CClogo.png" sizes="any" />
    <link rel="apple-touch-icon" href="/CClogo.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#080808" />
  </head>

  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (
        t === "dark" ||
        (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
